# Проверка сборки на каждый push: если сайт не собирается, GitHub покажет красный крестик до того, как сломанная версия уедет на Vercel.
name: Build check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
